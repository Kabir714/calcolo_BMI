<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolatore BMI</title>
    <link rel="stylesheet" href="stileComune.css">
</head>
<body>

    <main class="box">
        <h1>Calcolatore BMI</h1>

        <form method="post" action="calcoloBMI.php">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Luca" required>
            </div>

            <div class="form-group">
                <label for="peso">Peso (kg)</label>
                <input type="number" id="peso" name="peso" step="any" placeholder="70" required>
            </div>

            <div class="form-group">
                <label for="altezza">Altezza (cm)</label>
                <input type="number" id="altezza" name="altezza" placeholder="178" required>
            </div>

            <button type="submit">Calcola</button>
        </form>
    </main>

</body>
</html>
